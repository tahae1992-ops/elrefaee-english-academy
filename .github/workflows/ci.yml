name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: web

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Architecture boundary check
        run: npm run arch:check

      - name: RLS coverage check (SRS §12.2)
        run: npm run check:rls

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        # No DATABASE_URL needed here: next build never touches
        # drizzle.config.ts, and the /api/v1/health route's DB access is
        # request-time only (Next correctly marks it dynamic, verified in
        # Sprint 1) — so nothing at build time attempts a connection.

  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (allowlist-gated — see audit-ci.jsonc)
        run: npm run audit:check
